<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DabaBlane Agent Chat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Login Container -->
    <div id="loginContainer" class="login-container">
      <h3>DabaBlane Agent</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="passwordInput" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="passwordInput"
            required
            placeholder="Enter password"
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div
          id="loginError"
          class="text-danger mt-2"
          style="display: none"
        ></div>
      </form>
    </div>

    <!-- Chat Container -->
    <div id="chatContainer" class="chat-container" style="display: none">
      <div class="chat-header">
        <h3 class="mb-3 text-center">Chat with DabaBlane Agent</h3>
      </div>

      <!-- Controls -->
      <div class="chat-controls row mb-2">
        <div class="col-md-4 mb-2">
          <label for="envSelect" class="form-label">Environment</label>
          <select id="envSelect" class="form-select">
            <option value="http://localhost:8000">Development</option>
            <option value="https://agent.dabablane.com">Production</option>
          </select>
        </div>
        <div class="col-md-8 mb-2">
          <label for="sessionId" class="form-label">Session ID</label>
          <div class="d-flex">
            <select id="sessionId" class="form-select">
              <option value="">Select a session...</option>
            </select>
            <button
              id="clearHistoryBtn"
              class="btn btn-outline-danger ms-2"
              style="white-space: nowrap"
              type="button"
            >
              Clear Chat
            </button>
            <button
              id="clearAllHistoryBtn"
              class="btn btn-danger ms-2"
              style="white-space: nowrap"
              type="button"
              title="Clear chats for all sessions"
            >
              Clear All Chats
            </button>
          </div>
        </div>
      </div>

      <!-- Chat History -->
      <div id="chatHistory" class="chat-history"></div>

      <!-- Chat Input -->
      <form id="chatForm" class="input-group chat-input-row">
        <textarea
          id="messageInput"
          class="form-control"
          placeholder="Type your message..."
          required
          rows="1"
          style="resize: none"
        ></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </div>

    <!-- Scripts -->
    <script src="./js/auth.js"></script>
    <script src="./js/chat.js"></script>
  </body>
</html>
